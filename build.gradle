plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 ships Java 17 to players, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // NeoForge 1.20.1 (net.neoforged:forge). See DEVLOG for why this and not Forge.
    enable {
        neoForgeVersion = project.minecraft_version + '-' + project.neo_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id + ',nimbusqa,socialqa'
        }

        // Dev client that auto-joins the local dev server (runServer), screenshots the HUD, then quits.
        // Used for scripted end-to-end checks; see DEVLOG "verification recipe".
        clientTest {
            client()
            gameDirectory = project.file('run-clienttest')
            programArguments.addAll '--username', 'Dev', '--quickPlayMultiplayer', 'localhost:25565'
            // a window as big as the Xvfb screen (tools/devshots.sh), so close-ups show detail
            programArguments.addAll '--width', (project.findProperty('devWidth') ?: '1280').toString(), '--height', (project.findProperty('devHeight') ?: '720').toString()
            systemProperty 'dbzenith.debugSync', 'false'
            systemProperty 'dbzenith.devAutomation', 'true'
            systemProperty 'dbzenith.devScreenshots', project.findProperty('devScreenshots') ?: '400'
            systemProperty 'dbzenith.devQuitAfter', project.findProperty('devQuitAfter') ?: '500'
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id + ',nimbusqa,socialqa'
        }

        // Boots a headless server, runs every @GameTest in our namespace, then exits (non-zero on failure).
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id + ',nimbusqa,socialqa'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

repositories {
    maven { url = "https://maven.kosmx.dev/" }                                   // playerAnimator (KosmX)
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" } // GeckoLib
}

dependencies {
    // Mod dependencies must use the mod* configurations so they are remapped (see ModDevGradle LEGACY.md).
    // All are MIT-licensed and bundled with Jar-in-Jar, so players install a single jar.
    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"
    jarJar("dev.kosmx.player-anim:player-animation-lib-forge") {
        version { strictly "[${player_anim_version}]" }
    }
    // bendy-lib lets playerAnimator bend elbows and knees; without it every bend key is ignored (CX-15).
    modImplementation "io.github.kosmx.bendy-lib:bendy-lib-forge:${bendy_lib_version}"
    jarJar("io.github.kosmx.bendy-lib:bendy-lib-forge") {
        version { strictly "[${bendy_lib_version}]" }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

jar {
    manifest.attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : mod_authors
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ./gradlew installMod: build, then put the new jar into each mods folder listed in local.properties (mods.dirs,
// separated by ;) and delete only older jars of this mod (dbzenith-*.jar) there. Nothing is touched if the build fails.
def installProps = new Properties()
def installPropsFile = rootProject.file('local.properties')
if (installPropsFile.exists()) installPropsFile.withInputStream { installProps.load(it) }
def installDirs = (installProps.getProperty('mods.dirs') ?: '').split(';').collect { it.trim() }.findAll { it }
def installJar = file("build/libs/${mod_id}-${mod_version}.jar")
def installPrefix = "${mod_id}-"
tasks.register('installMod') {
    group = 'dbzenith'
    description = 'Builds the mod and installs the jar into the mods folders in local.properties (mods.dirs).'
    dependsOn 'build'
    doLast {
        if (installDirs.isEmpty()) throw new GradleException("Create local.properties with mods.dirs=<your mods folder> (several separated by ;)")
        if (!installJar.exists()) throw new GradleException("No jar at ${installJar}")
        installDirs.each { d ->
            def dir = new File(d)
            if (!dir.isDirectory()) { println("installMod: no folder ${dir}, skipped"); return }
            dir.listFiles().findAll { it.name.startsWith(installPrefix) && it.name.endsWith('.jar') && Character.isDigit(it.name.charAt(installPrefix.length())) && it.name != installJar.name }.each {
                println(it.delete() ? "installMod: removed ${it.name}" : "installMod: could not remove ${it.name} (is Minecraft running?)")
            }
            java.nio.file.Files.copy(installJar.toPath(), new File(dir, installJar.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println("installMod: installed ${installJar.name} into ${dir}")
        }
    }
}
