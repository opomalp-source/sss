# Gradle daemon settings. MC decompilation needs memory.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names (optional, readability only)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# NeoForge for 1.20.1 is published as net.neoforged:forge:1.20.1-47.1.x (final release line: 47.1.106)
neo_version=47.1.106
neo_version_range=[47.1,)
loader_version_range=[47,)

# Mod properties
mod_id=dbzenith
mod_name=Dragon Block Zenith
mod_license=All Rights Reserved
mod_version=0.81.0
mod_group_id=com.dbzenith
mod_authors=Dragon Block Zenith team
mod_description=A Dragon Ball-inspired total-conversion mod: ki, stats, transformations, races, training and more.\nOriginal placeholder assets; not affiliated with Toei, Shueisha or JinGames.
player_anim_version=1.0.2-rc1+1.20
bendy_lib_version=4.0.0
